# Production: DB và tệp nằm trên Supabase (DATABASE_URL, SUPABASE_* trong .env).
# Môi trường đo hiệu năng có DB local riêng: docker-compose.bench.yml
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamchat_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./deploy/nginx
    container_name: teamchat_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      CERT_IPS: ${CERT_IPS:-}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - certs:/etc/nginx/certs

volumes:
  certs: