# Production: DB và tệp nằm trên Supabase (DATABASE_URL, SUPABASE_* trong .env).
# Môi trường đo hiệu năng có DB local riêng: docker-compose.bench.yml
services:
  redis:
    image: redis:7-alpine
    container_name: teamchat_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamchat_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      # Cache danh sách phòng dùng chung Redis để đúng cả khi chạy nhiều worker
      CACHE_BACKEND: redis
      LIVEKIT_DEPLOYMENT: ${LIVEKIT_DEPLOYMENT:-self-hosted}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_URL: ${LIVEKIT_API_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      LIVEKIT_ROOM_PREFIX: ${LIVEKIT_ROOM_PREFIX:-teamchat-call-}
      GROUP_CALL_MAX_PARTICIPANTS: ${GROUP_CALL_MAX_PARTICIPANTS:-0}
    depends_on:
      - redis
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./deploy/nginx
    container_name: teamchat_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      CERT_IPS: ${CERT_IPS:-}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./deploy/livekit/nginx-location.conf:/etc/nginx/locations/livekit.conf:ro
      - certs:/etc/nginx/certs

  # .env: COMPOSE_PROFILES=livekit cho self-hosted; để trống khi dùng Cloud.
  livekit:
    profiles: [livekit]
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    command:
      - --config
      - /etc/livekit.yaml
      - --node-ip
      - ${LIVEKIT_NODE_IP:-127.0.0.1}
      - --keys
      - "${LIVEKIT_API_KEY:-teamchat-local}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      - ./deploy/livekit/livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "${LIVEKIT_SIGNAL_PORT:-7880}:7880"
      - "7881:7881/tcp"
      - "7882:7882/udp"

volumes:
  certs:
  redis_data:
