services:
  db:
    image: postgres:16-alpine
    container_name: teamchat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: teamchat_db
    ports:
      - "5432:5432"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamchat_backend
    restart: unless-stopped
    depends_on:
      - db
    env_file:
      - .env
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./backend:/app

  web:
    build:
      context: ./deploy/nginx
    container_name: teamchat_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      CERT_IPS: ${CERT_IPS:-}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - certs:/etc/nginx/certs

volumes:
  certs: