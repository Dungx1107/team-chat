services:
  db:
    image: postgres:16-alpine
    container_name: teamchat_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: teamchat_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      UPLOAD_DIR: /app/uploads
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      # Tệp đính kèm và ảnh đại diện nằm ở volume riêng,
      # tách khỏi mã nguồn và khỏi dữ liệu Postgres
      - uploads:/app/uploads

  # Cổng vào duy nhất qua HTTPS: phục vụ giao diện, chuyển /api và /ws về backend.
  # Cần HTTPS vì trình duyệt chỉ cho dùng micro/camera trên kết nối bảo mật.
  web:
    build:
      context: ./deploy/nginx
    container_name: teamchat_web
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      # IP LAN của máy chạy server, để chứng chỉ khớp khi vào từ thiết bị khác
      CERT_IPS: ${CERT_IPS:-}
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - certs:/etc/nginx/certs

volumes:
  pgdata:
  uploads:
  certs:
