<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Chat Client</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex flex-col font-sans text-slate-800">

  <!-- Header chung -->
  <header class="bg-indigo-600 text-white px-6 py-3 flex justify-between items-center shadow">
    <div>
      <h1 class="font-bold text-base tracking-wide">Team Chat System</h1>
      <p class="text-xs text-indigo-200">Kiến trúc 4 lớp (Clean Architecture Demo)</p>
    </div>
    <div id="user-info-bar" class="hidden flex items-center gap-3 text-sm">
      <span id="user-display-name" class="font-medium bg-indigo-700 px-3 py-1 rounded-full text-xs"></span>
      <button onclick="handleLogout()" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1 rounded transition text-white">Đăng xuất</button>
    </div>
  </header>

  <!-- Container chính -->
  <div class="flex-1 flex overflow-hidden relative">

    <!-- ==================== MÀN HÌNH 1: AUTH VIEW ==================== -->
    <section id="auth-view" class="m-auto w-full max-w-md p-6 bg-white rounded-xl shadow-md border border-slate-200">
      <div class="flex border-b border-slate-200 mb-5">
        <button id="tab-login-btn" onclick="switchAuthTab('login')" class="flex-1 py-2 font-semibold text-indigo-600 border-b-2 border-indigo-600 text-sm">Đăng Nhập</button>
        <button id="tab-register-btn" onclick="switchAuthTab('register')" class="flex-1 py-2 font-semibold text-slate-500 text-sm">Đăng Ký</button>
      </div>

      <div id="auth-alert" class="hidden text-xs p-3 rounded mb-4"></div>

      <!-- Form Đăng Nhập -->
      <form id="form-login" onsubmit="onLoginSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
          <input type="email" id="login-email" required placeholder="user@example.com" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu</label>
          <input type="password" id="login-password" required placeholder="••••••••" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded text-sm font-medium hover:bg-indigo-700 transition">Đăng Nhập</button>
      </form>

      <!-- Form Đăng Ký -->
      <form id="form-register" onsubmit="onRegisterSubmit(event)" class="space-y-3 hidden">
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Họ</label>
            <input type="text" id="reg-lastname" required placeholder="Nguyễn" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Tên</label>
            <input type="text" id="reg-firstname" required placeholder="Dũng" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-indigo-500">
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Tên đăng nhập (Username)</label>
          <input type="text" id="reg-username" required placeholder="dungx" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Email</label>
          <input type="email" id="reg-email" required placeholder="dungx@example.com" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-indigo-500">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">Mật khẩu</label>
          <input type="password" id="reg-password" required minlength="6" placeholder="Tối thiểu 6 ký tự" class="w-full border border-slate-300 rounded px-3 py-2 text-sm focus:outline-indigo-500">
        </div>
        <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded text-sm font-medium hover:bg-indigo-700 transition">Đăng Ký Tài Khoản</button>
      </form>
    </section>

    <!-- ==================== MÀN HÌNH 2: CHAT DASHBOARD VIEW ==================== -->
    <section id="chat-view" class="hidden flex-1 flex w-full h-full">
      
      <!-- Cột trái: Quản lý phòng (Sidebar) -->
      <aside class="w-72 bg-white border-r border-slate-200 flex flex-col">
        <div class="p-3 border-b border-slate-200 flex justify-between items-center bg-slate-50">
          <span class="font-semibold text-xs text-slate-600 uppercase tracking-wider">Danh sách phòng</span>
          <button onclick="onPromptCreateRoom()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1 rounded shadow transition">+ Tạo phòng</button>
        </div>
        <div id="room-list-container" class="flex-1 overflow-y-auto divide-y divide-slate-100">
          <!-- Room items render tại đây -->
        </div>
      </aside>

      <!-- Cột phải: Khung Chat chính -->
      <main class="flex-1 flex flex-col bg-white">
        <!-- Header khung chat -->
        <div id="chat-header-bar" class="px-6 py-3 border-b border-slate-200 bg-slate-50 flex justify-between items-center">
          <div>
            <h2 id="active-room-name" class="font-bold text-slate-800 text-sm">Chưa chọn phòng nào</h2>
            <p id="active-room-desc" class="text-xs text-slate-400">Chọn một phòng ở danh sách bên trái để bắt đầu trò chuyện</p>
          </div>
          <button id="btn-delete-room" onclick="onDeleteCurrentRoom()" class="hidden text-xs bg-red-50 hover:bg-red-100 text-red-600 px-3 py-1.5 rounded border border-red-200 font-medium transition">
            Xóa phòng này
          </button>
        </div>

        <!-- Khu vực hiển thị tin nhắn -->
        <div id="messages-scroll-area" class="flex-1 p-6 overflow-y-auto space-y-3 bg-slate-50">
          <p class="text-center text-slate-400 text-xs mt-12">Chọn một phòng bên trái để xem nội dung trò chuyện</p>
        </div>

        <!-- Ô nhập nội dung và nút gửi -->
        <form id="form-send-message" onsubmit="onSendMessageSubmit(event)" class="p-4 border-t border-slate-200 bg-white flex gap-2">
          <input type="text" id="input-message" placeholder="Nhập tin nhắn..." disabled class="flex-1 border border-slate-300 rounded-lg px-4 py-2 text-sm focus:outline-indigo-500 disabled:bg-slate-100 disabled:cursor-not-allowed">
          <button type="submit" id="btn-send-message" disabled class="bg-indigo-600 text-white px-5 py-2 rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed transition">
            Gửi
          </button>
        </form>
      </main>

    </section>

  </div>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
