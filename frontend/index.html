<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Chat</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-slate-100 text-slate-800 antialiased">

  <!-- ===================== MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ ===================== -->
  <div id="auth-view" class="hidden min-h-screen flex items-center justify-center p-4 auth-bg">
    <div class="w-full max-w-md">
      <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-white/15 backdrop-blur mb-3">
          <span class="text-3xl">💬</span>
        </div>
        <h1 class="text-2xl font-bold text-white">Team Chat</h1>
        <p class="text-white/70 text-sm mt-1">Không gian trao đổi nội bộ của nhóm</p>
      </div>

      <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
        <div class="flex border-b border-slate-100">
          <button id="tab-login-btn" onclick="switchAuthTab('login')"
                  class="flex-1 py-3 font-semibold text-indigo-600 border-b-2 border-indigo-600 text-sm">
            Đăng nhập
          </button>
          <button id="tab-register-btn" onclick="switchAuthTab('register')"
                  class="flex-1 py-3 font-semibold text-slate-400 text-sm">
            Đăng ký
          </button>
        </div>

        <div class="p-6">
          <div id="auth-alert" class="hidden mb-4 p-3 rounded-lg text-sm"></div>

          <form id="form-login" onsubmit="onLoginSubmit(event)" class="space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">Email</label>
              <input id="login-email" type="email" required autocomplete="username"
                     class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                     placeholder="user1@example.com" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">Mật khẩu</label>
              <input id="login-password" type="password" required autocomplete="current-password"
                     class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition"
                     placeholder="••••••••" />
            </div>
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm">
              Đăng nhập
            </button>
            <p class="text-[11px] text-slate-400 text-center pt-1">
              Tài khoản thử: <span class="font-mono">user1@example.com</span> / <span class="font-mono">password123</span>
            </p>
          </form>

          <form id="form-register" onsubmit="onRegisterSubmit(event)" class="space-y-4 hidden">
            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">Họ</label>
                <input id="reg-lastname" required
                       class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-600 mb-1.5">Tên</label>
                <input id="reg-firstname" required
                       class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
              </div>
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">Tên đăng nhập</label>
              <input id="reg-username" required minlength="3"
                     class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">Email</label>
              <input id="reg-email" type="email" required
                     class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1.5">Mật khẩu</label>
              <input id="reg-password" type="password" required minlength="6"
                     class="w-full px-3.5 py-2.5 border border-slate-200 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 outline-none" />
            </div>
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm">
              Tạo tài khoản
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- ===================== MÀN HÌNH CHAT ===================== -->
  <div id="chat-view" class="hidden h-screen flex overflow-hidden">

    <!-- Cột trái: danh sách phòng -->
    <aside class="w-64 bg-slate-900 text-slate-300 flex flex-col shrink-0" id="sidebar">
      <div class="h-14 px-4 flex items-center justify-between border-b border-white/10 shrink-0">
        <div class="flex items-center gap-2 min-w-0">
          <span class="text-lg">💬</span>
          <span class="font-bold text-white text-sm truncate">Team Chat</span>
        </div>
        <span id="ws-status" title="Trạng thái kết nối realtime"
              class="w-2 h-2 rounded-full bg-slate-500 shrink-0"></span>
      </div>

      <div class="px-3 py-2.5 flex items-center justify-between shrink-0">
        <span class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Phòng chat</span>
        <button onclick="openCreateRoomModal()" title="Tạo phòng mới"
                class="w-5 h-5 flex items-center justify-center rounded hover:bg-white/10 text-slate-400 hover:text-white transition text-lg leading-none">
          +
        </button>
      </div>

      <div id="room-list-container" class="flex-1 overflow-y-auto px-2 pb-2 space-y-0.5 scroll-thin"></div>

      <!-- Thẻ người dùng dưới cùng -->
      <div class="border-t border-white/10 p-2.5 shrink-0">
        <div class="flex items-center gap-2.5">
          <button onclick="openProfileModal()" class="shrink-0" title="Hồ sơ của tôi">
            <span id="my-avatar"></span>
          </button>
          <div class="min-w-0 flex-1 cursor-pointer" onclick="openProfileModal()">
            <div id="user-display-name" class="text-xs font-semibold text-white truncate"></div>
            <div id="user-display-status" class="text-[11px] text-slate-500 truncate"></div>
          </div>
          <button onclick="handleLogout()" title="Đăng xuất"
                  class="shrink-0 w-7 h-7 flex items-center justify-center rounded hover:bg-white/10 text-slate-400 hover:text-red-400 transition">
            ⏻
          </button>
        </div>
      </div>
    </aside>

    <!-- Cột giữa: khung chat -->
    <main class="flex-1 flex flex-col bg-white min-w-0">
      <header class="h-14 px-5 flex items-center justify-between border-b border-slate-200 shrink-0">
        <div class="min-w-0">
          <h2 id="active-room-name" class="font-bold text-slate-900 text-sm truncate">Chưa chọn phòng nào</h2>
          <p id="active-room-desc" class="text-[11px] text-slate-500 truncate">
            Chọn một phòng ở danh sách bên trái để bắt đầu trò chuyện
          </p>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="btn-toggle-members" onclick="toggleMembersPanel()" title="Thành viên"
                  class="hidden px-2.5 py-1.5 text-xs rounded-lg hover:bg-slate-100 text-slate-600 transition">
            👥 <span id="member-count-badge">0</span>
          </button>
          <button id="btn-room-settings" onclick="openRoomSettingsModal()" title="Cài đặt phòng"
                  class="hidden px-2.5 py-1.5 text-xs rounded-lg hover:bg-slate-100 text-slate-600 transition">
            ⚙️
          </button>
          <button id="btn-leave-room" onclick="onLeaveCurrentRoom()" title="Rời phòng"
                  class="hidden px-2.5 py-1.5 text-xs rounded-lg hover:bg-amber-50 text-amber-600 transition">
            Rời phòng
          </button>
          <button id="btn-delete-room" onclick="onDeleteCurrentRoom()" title="Xóa phòng"
                  class="hidden px-2.5 py-1.5 text-xs rounded-lg hover:bg-red-50 text-red-600 transition">
            Xóa phòng
          </button>
        </div>
      </header>

      <div id="messages-scroll-area" class="flex-1 overflow-y-auto px-5 py-4 space-y-0.5 bg-slate-50 scroll-thin">
        <div class="text-center text-slate-400 text-xs mt-16">
          Chọn một phòng để xem tin nhắn
        </div>
      </div>

      <div id="typing-indicator" class="px-5 h-5 text-[11px] text-slate-400 italic shrink-0"></div>

      <div class="px-4 pb-4 pt-1 shrink-0">
        <div id="upload-preview" class="hidden mb-2"></div>
        <form onsubmit="onSendMessageSubmit(event)" class="flex items-end gap-2">
          <button type="button" onclick="document.getElementById('file-input').click()"
                  id="btn-attach" disabled title="Đính kèm tệp"
                  class="shrink-0 w-10 h-10 flex items-center justify-center rounded-xl border border-slate-200 hover:bg-slate-100 text-slate-500 transition disabled:opacity-40 disabled:cursor-not-allowed">
            📎
          </button>
          <input type="file" id="file-input" class="hidden" onchange="onFileSelected(event)" />
          <textarea id="input-message" rows="1" disabled
                    onkeydown="onMessageKeyDown(event)" oninput="autoGrow(this); notifyTyping()"
                    placeholder="Nhập tin nhắn..."
                    class="flex-1 px-4 py-2.5 border border-slate-200 rounded-xl text-sm resize-none outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition disabled:bg-slate-50 max-h-32 scroll-thin"></textarea>
          <button type="submit" id="btn-send-message" disabled
                  class="shrink-0 w-10 h-10 flex items-center justify-center bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl transition disabled:opacity-40 disabled:cursor-not-allowed">
            ➤
          </button>
        </form>
      </div>
    </main>

    <!-- Cột phải: thành viên -->
    <aside id="members-panel" class="hidden w-60 bg-white border-l border-slate-200 flex-col shrink-0">
      <div class="h-14 px-4 flex items-center justify-between border-b border-slate-200 shrink-0">
        <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Thành viên</span>
        <button id="btn-add-member" onclick="openAddMemberModal()" title="Thêm thành viên"
                class="hidden w-6 h-6 flex items-center justify-center rounded hover:bg-slate-100 text-slate-500 text-lg leading-none">
          +
        </button>
      </div>
      <div id="members-list" class="flex-1 overflow-y-auto p-2 space-y-0.5 scroll-thin"></div>
    </aside>
  </div>

  <!-- ===================== CÁC HỘP THOẠI ===================== -->
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ws.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/rooms.js"></script>
  <script src="js/messages.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
