# HTTP chỉ để chuyển hướng sang HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Cổng dành riêng cho tunnel (cloudflared/ngrok) khi muốn gọi qua Internet.
# Phục vụ HTTP thuần, không chuyển hướng: tunnel tự lo phần mã hóa và cấp
# chứng chỉ thật, nên không vướng chứng chỉ tự ký ở cổng 443.
# Chỉ mở trong mạng nội bộ Docker và localhost, không phơi ra LAN.
server {
    listen 8080;
    server_name _;

    client_max_body_size 30m;

    root  /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Tunnel đứng trước nên request tới đây là HTTP, nhưng người dùng
        # thực sự đang dùng HTTPS -- báo đúng để backend không hiểu nhầm
        proxy_set_header   X-Forwarded-Proto https;
        proxy_request_buffering off;
    }

    location = /ws {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ~ ^/(docs|redoc|health)$ {
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Tệp đính kèm tối đa 25MB, chừa thêm cho phần đầu multipart
    client_max_body_size 30m;

    root  /usr/share/nginx/html;
    index index.html;

    # REST API -> backend. Backend chỉ chạy HTTP trong mạng nội bộ Docker,
    # nginx lo phần mã hóa (TLS termination).
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # WebSocket cần nâng cấp kết nối và giữ mở lâu
    location = /ws {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Tài liệu API và health check
    location ~ ^/(docs|redoc|health)$ {
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
